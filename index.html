<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デジタル時計 - マルチタイムゾーン</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-group label {
            color: #555;
            font-weight: bold;
            font-size: 0.95em;
        }

        .control-group select,
        .control-group button {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-group select {
            background: white;
            color: #333;
        }

        .control-group select:hover {
            background: #f0f0f0;
        }

        .control-group button {
            background: #667eea;
            color: white;
            font-weight: bold;
        }

        .control-group button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .clock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            transition: transform 0.3s ease;
        }

        .clock-card:hover {
            transform: translateY(-5px);
        }

        .clock-card h2 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .digital-display {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .digital-time {
            font-size: 2.5em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .digital-date {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .analog-clock {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            position: relative;
            background: white;
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .clock-center {
            width: 12px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .clock-hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            background: #333;
            border-radius: 10px;
        }

        .hour-hand {
            width: 6px;
            height: 50px;
            margin-left: -3px;
        }

        .minute-hand {
            width: 4px;
            height: 70px;
            margin-left: -2px;
            background: #555;
        }

        .second-hand {
            width: 2px;
            height: 80px;
            margin-left: -1px;
            background: #e74c3c;
        }

        .clock-numbers {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .clock-number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-btn {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .remove-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
            }

            .control-group {
                width: 100%;
            }

            .clock-grid {
                grid-template-columns: 1fr;
            }

            .digital-time {
                font-size: 1.8em;
            }

            .analog-clock {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⏰ デジタル時計</h1>
            <p style="color: #666; font-size: 0.95em;">マルチタイムゾーン対応</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="timezone-select">タイムゾーン:</label>
                <select id="timezone-select">
                    <option value="Asia/Tokyo">東京 (JST)</option>
                    <option value="America/New_York">ニューヨーク (EST)</option>
                    <option value="Europe/London">ロンドン (GMT)</option>
                    <option value="Europe/Paris">パリ (CET)</option>
                    <option value="Asia/Hong_Kong">香港 (HKT)</option>
                    <option value="Australia/Sydney">シドニー (AEDT)</option>
                    <option value="America/Los_Angeles">ロサンゼルス (PST)</option>
                    <option value="Asia/Dubai">ドバイ (GST)</option>
                    <option value="Asia/Singapore">シンガポール (SGT)</option>
                    <option value="America/Chicago">シカゴ (CST)</option>
                </select>
            </div>

            <div class="control-group">
                <button id="add-btn">➕ タイムゾーン追加</button>
            </div>

            <div class="control-group">
                <label for="time-format">表示形式:</label>
                <button id="format-btn" style="width: auto;">24時間制</button>
            </div>

            <div class="control-group">
                <label for="show-analog">
                    <input type="checkbox" id="show-analog" checked> アナログ時計表示
                </label>
            </div>
        </div>

        <div class="clock-grid" id="clock-grid"></div>
    </div>

    <script>
        let timezones = ['Asia/Tokyo', 'America/New_York', 'Europe/London'];
        let use24HourFormat = true;
        let showAnalogClock = true;

        const timezoneSelect = document.getElementById('timezone-select');
        const addBtn = document.getElementById('add-btn');
        const formatBtn = document.getElementById('format-btn');
        const showAnalogCheckbox = document.getElementById('show-analog');
        const clockGrid = document.getElementById('clock-grid');

        addBtn.addEventListener('click', () => {
            const selectedTimezone = timezoneSelect.value;
            if (!timezones.includes(selectedTimezone)) {
                timezones.push(selectedTimezone);
                updateClocks();
            } else {
                alert('このタイムゾーンはすでに追加されています。');
            }
        });

        formatBtn.addEventListener('click', () => {
            use24HourFormat = !use24HourFormat;
            formatBtn.textContent = use24HourFormat ? '24時間制' : '12時間制';
            updateClocks();
        });

        showAnalogCheckbox.addEventListener('change', () => {
            showAnalogClock = showAnalogCheckbox.checked;
            updateClocks();
        });

        function formatTime(date, is24Hour) {
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');

            if (is24Hour) {
                return `${hours}:${minutes}:${seconds}`;
            } else {
                const hour12 = date.getHours() % 12 || 12;
                const period = date.getHours() >= 12 ? 'PM' : 'AM';
                return `${String(hour12).padStart(2, '0')}:${minutes}:${seconds} ${period}`;
            }
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}年${month}月${day}日`;
        }

        function updateAnalogClock(container, date) {
            const hourHand = container.querySelector('.hour-hand');
            const minuteHand = container.querySelector('.minute-hand');
            const secondHand = container.querySelector('.second-hand');

            const hours = date.getHours();
            const minutes = date.getMinutes();
            const seconds = date.getSeconds();

            const hourDegrees = (hours % 12) * 30 + minutes * 0.5;
            const minuteDegrees = minutes * 6 + seconds * 0.1;
            const secondDegrees = seconds * 6;

            hourHand.style.transform = `rotate(${hourDegrees}deg)`;
            minuteHand.style.transform = `rotate(${minuteDegrees}deg)`;
            secondHand.style.transform = `rotate(${secondDegrees}deg)`;
        }

        function createClockCard(timezone) {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('ja-JP', {
                timeZone: timezone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const parts = formatter.formatToParts(now);
            const timeObj = {};
            parts.forEach(part => {
                timeObj[part.type] = part.value;
            });

            const tzDate = new Date(now.toLocaleString('en-US', { timeZone: timezone }));

            const card = document.createElement('div');
            card.className = 'clock-card';

            let cityName = timezone.split('/')[1].replace(/_/g, ' ');
            const tzMapping = {
                'Tokyo': '東京',
                'New_York': 'ニューヨーク',
                'London': 'ロンドン',
                'Paris': 'パリ',
                'Hong_Kong': '香港',
                'Sydney': 'シドニー',
                'Los_Angeles': 'ロサンゼルス',
                'Dubai': 'ドバイ',
                'Singapore': 'シンガポール',
                'Chicago': 'シカゴ'
            };

            for (let key in tzMapping) {
                if (timezone.includes(key)) {
                    cityName = tzMapping[key];
                    break;
                }
            }

            card.innerHTML = `
                <h2>${cityName}</h2>
                <div class="digital-display">
                    <div class="digital-time" data-timezone="${timezone}">
                        ${timeObj.hour}:${timeObj.minute}:${timeObj.second}
                    </div>
                    <div class="digital-date">${timeObj.year}年${timeObj.month}月${timeObj.day}日</div>
                </div>
                ${showAnalogClock ? `
                    <div class="analog-clock" data-timezone="${timezone}">
                        <div class="clock-numbers">
                            <div class="clock-number" style="transform: rotate(0deg) translateY(-85px);">12</div>
                            <div class="clock-number" style="transform: rotate(30deg) translateY(-85px);">1</div>
                            <div class="clock-number" style="transform: rotate(60deg) translateY(-85px);">2</div>
                            <div class="clock-number" style="transform: rotate(90deg) translateY(-85px);">3</div>
                            <div class="clock-number" style="transform: rotate(120deg) translateY(-85px);">4</div>
                            <div class="clock-number" style="transform: rotate(150deg) translateY(-85px);">5</div>
                            <div class="clock-number" style="transform: rotate(180deg) translateY(-85px);">6</div>
                            <div class="clock-number" style="transform: rotate(210deg) translateY(-85px);">7</div>
                            <div class="clock-number" style="transform: rotate(240deg) translateY(-85px);">8</div>
                            <div class="clock-number" style="transform: rotate(270deg) translateY(-85px);">9</div>
                            <div class="clock-number" style="transform: rotate(300deg) translateY(-85px);">10</div>
                            <div class="clock-number" style="transform: rotate(330deg) translateY(-85px);">11</div>
                        </div>
                        <div class="clock-hand hour-hand"></div>
                        <div class="clock-hand minute-hand"></div>
                        <div class="clock-hand second-hand"></div>
                        <div class="clock-center"></div>
                    </div>
                ` : ''}
                <button class="remove-btn" onclick="removeTimezone('${timezone}')">✕ 削除</button>
            `;

            return card;
        }

        function updateClocks() {
            clockGrid.innerHTML = '';
            timezones.forEach(timezone => {
                const card = createClockCard(timezone);
                clockGrid.appendChild(card);

                if (showAnalogClock) {
                    const now = new Date();
                    const tzDate = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
                    const analogClock = card.querySelector('.analog-clock');
                    if (analogClock) {
                        updateAnalogClock(analogClock, tzDate);
                    }
                }
            });
        }

        window.removeTimezone = function(timezone) {
            timezones = timezones.filter(tz => tz !== timezone);
            updateClocks();
        };

        // 毎秒更新
        setInterval(() => {
            timezones.forEach(timezone => {
                const now = new Date();
                const tzDate = new Date(now.toLocaleString('en-US', { timeZone: timezone }));

                const timeDisplay = document.querySelector(`[data-timezone="${timezone}"]`);
                if (timeDisplay) {
                    timeDisplay.textContent = formatTime(tzDate, use24HourFormat);
                }

                if (showAnalogClock) {
                    const analogClock = document.querySelector(`.analog-clock[data-timezone="${timezone}"]`);
                    if (analogClock) {
                        updateAnalogClock(analogClock, tzDate);
                    }
                }
            });
        }, 1000);

        // 初期表示
        updateClocks();
    </script>
</body>
</html>
